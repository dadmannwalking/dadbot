[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dadbot"
version = "0.1.0"
description = "Discord bot bootstrap"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "apscheduler>=3.10,<4",
    "discord.py>=2.4,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
